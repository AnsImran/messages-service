name: CI

# Push to main runs test -> build -> push -> deploy.
# Docs-only pushes skip entirely. PRs run only the test job.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.env.example'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile Python
        run: uv run python -m compileall -q src main.py

      - name: Run tests (best-effort; allow pass when no tests)
        run: |
          if [ -d tests ] && [ -n "$(ls tests/*.py 2>/dev/null)" ]; then
            uv run pytest -v
          else
            echo "No tests/ dir or no test files — skipping pytest."
          fi

  build-and-push:
    name: Build and push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sms-service image
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/ansimran/messages-service/sms-service:latest
          provenance: false
          sbom: false
          cache-from: type=registry,ref=ghcr.io/ansimran/messages-service/sms-service:buildcache
          cache-to: type=registry,ref=ghcr.io/ansimran/messages-service/sms-service:buildcache,mode=max

  deploy:
    name: Deploy to server
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy-sms-service
      cancel-in-progress: true
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}"    || (echo "Missing secret: DEPLOY_HOST"    && exit 1)
          test -n "${{ secrets.DEPLOY_USER }}"    || (echo "Missing secret: DEPLOY_USER"    && exit 1)
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || (echo "Missing secret: DEPLOY_SSH_KEY" && exit 1)
          test -n "${{ secrets.GHCR_USER }}"      || (echo "Missing secret: GHCR_USER"      && exit 1)
          test -n "${{ secrets.GHCR_TOKEN }}"     || (echo "Missing secret: GHCR_TOKEN"     && exit 1)

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.DEPLOY_PORT }}"
          if [ -z "$PORT" ]; then PORT="22"; fi
          ssh-keyscan -p "$PORT" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull GHCR image and redeploy
        shell: bash
        run: |
          set -euo pipefail
          PORT="${{ secrets.DEPLOY_PORT }}"
          if [ -z "$PORT" ]; then PORT="22"; fi

          ssh -p "$PORT" -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "GHCR_USER='${{ secrets.GHCR_USER }}' GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}' bash -s" <<'EOS'
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0

          cd /home/ubuntu/messages-service

          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f

          echo "Waiting for service to become healthy..."
          sleep 8
          docker compose ps
          echo "--- /api/v1/ping ---"
          curl -sS --max-time 5 http://127.0.0.1:8200/api/v1/ping || true
          echo
          EOS
